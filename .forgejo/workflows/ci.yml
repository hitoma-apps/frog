name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, lint and test
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal -c rustfmt,clippy
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Release build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --locked --all-targets

      - name: Upload release build
        uses: actions/upload-artifact@v3
        with:
          name: frog-linux-x86_64
          path: |
            target/release/frog
            target/release/libgmail_imap_proto.rlib
          if-no-files-found: error
          retention-days: 14

  appimage:
    name: AppImage (reuses the Linux release build)
    needs: build
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Download the Linux release build
        uses: actions/download-artifact@v3
        with:
          name: frog-linux-x86_64
          path: target/release

      - name: Get appimagetool
        run: |
          set -eu
          asset=appimagetool-x86_64.AppImage
          release=https://api.github.com/repos/AppImage/appimagetool/releases/tags/continuous
          url=https://github.com/AppImage/appimagetool/releases/download/continuous/$asset
          # The checksum comes from the release metadata, not from the download itself. The job
          # fails if GitHub doesn't publish one, rather than running an unchecked tool.
          curl --proto '=https' --tlsv1.2 -sSfL -o "$HOME/release.json" "$release"
          digest=$(python3 -c '
          import json, sys
          asset = sys.argv[2]
          release = json.load(open(sys.argv[1]))
          match = [a.get("digest", "") for a in release.get("assets", []) if a.get("name") == asset]
          if not match or not match[0].startswith("sha256:"):
              sys.exit("no sha256 digest published for " + asset)
          print(match[0][len("sha256:"):])
          ' "$HOME/release.json" "$asset")
          curl --proto '=https' --tlsv1.2 -sSfL -o "$HOME/appimagetool" "$url"
          echo "$digest  $HOME/appimagetool" | sha256sum -c -
          chmod +x "$HOME/appimagetool"

      - name: Build the AppImage
        env:
          SKIP_BUILD: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x target/release/frog
          APPIMAGETOOL="$HOME/appimagetool" sh packaging/appimage/build.sh

      - name: Upload the AppImage
        uses: actions/upload-artifact@v3
        with:
          name: FROG-x86_64.AppImage
          path: target/FROG-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows build (cross-compiled)
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain and MinGW
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi
          $SUDO apt-get update -q
          DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y -q gcc-mingw-w64-x86-64
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add x86_64-pc-windows-gnu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Release build for Windows
        run: cargo build --release --locked --target x86_64-pc-windows-gnu

      - name: Sign Windows binary
        env:
          CODESIGN_PFX_B64: ${{ secrets.CODESIGN_PFX_B64 }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          set -euo pipefail
          exe=target/x86_64-pc-windows-gnu/release/frog.exe
          if [ -z "$CODESIGN_PFX_B64" ]; then
            echo "::warning::CODESIGN_PFX_B64 is not set; the Windows binary is unsigned"
            exit 0
          fi
          sudo_cmd=""
          if [ "$(id -u)" -ne 0 ]; then sudo_cmd="sudo"; fi
          $sudo_cmd apt-get install -y -q osslsigncode
          work=$(mktemp -d)
          printf '%s' "$CODESIGN_PFX_B64" | base64 -d > "$work/codesign.pfx"
          printf '%s' "$CODESIGN_PASSWORD" > "$work/pass.txt"
          osslsigncode sign \
            -pkcs12 "$work/codesign.pfx" -readpass "$work/pass.txt" \
            -n "FROG" -h sha256 \
            -in "$exe" -out "$work/signed.exe"
          mv "$work/signed.exe" "$exe"
          rm -rf "$work"
          osslsigncode verify -in "$exe" || true

      - name: Upload Windows build
        uses: actions/upload-artifact@v3
        with:
          name: frog-windows-x86_64
          path: |
            target/x86_64-pc-windows-gnu/release/frog.exe
            signing/gmail-labels-test-signing.cer
          if-no-files-found: error
          retention-days: 14
