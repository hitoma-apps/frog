[package]
name = "frog"
version = "0.1.0"
edition = "2024"
description = "FROG (Fast Read-Oriented Gmail): a small, fast Gmail client built for reading"
license = "MIT"
repository = "https://github.com/hitoma-apps/frog"

[features]
# Runs against a built-in demo mailbox instead of Gmail, for screenshots and manual checks.
demo = ["eframe/glow"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6.0.0"
eframe = "0.37.0"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
mail-parser = "0.11.9"
notify-rust = "4.19.0"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
velopack = "1.2.0"
webpki-roots = "1.0.12"
zstd = "0.14.4"

# Smaller release binary (about 23 MB on Linux, from 38 MB): no symbols, whole-program
# optimisation, and one codegen unit. Panics still unwind, so the app can offer a restart.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1

[build-dependencies]
winres = "0.1"
