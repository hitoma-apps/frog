[package]
name = "gmail-imap-proto"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
eframe = "0.37.0"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
mail-parser = "0.11.9"
notify-rust = "4.19.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
webpki-roots = "1.0.12"
zstd = "0.14.4"

# Smaller release binary (about 23 MB on Linux, from 38 MB): no symbols, whole-program
# optimisation, and one codegen unit. Panics still unwind, so the app can offer a restart.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
