name: CI

# Actions are pinned to commit SHAs. Dependabot proposes updates; the tag is kept in a comment.

# Every branch push runs CI, so a branch is checked before it's merged.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Release build
        run: cargo build --release --locked

      # Uploaded unzipped, so the binary keeps its executable bit. An unzipped artifact takes its
      # file's name, so this one is called "frog".
      - name: Upload the Linux binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: target/release/frog
          archive: false
          if-no-files-found: error
          retention-days: 14

  appimage:
    name: AppImage (reuses the Linux build)
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the Linux binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frog
          path: target/release

      - name: Get appimagetool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          asset=appimagetool-x86_64.AppImage
          release=https://api.github.com/repos/AppImage/appimagetool/releases/tags/continuous
          url=https://github.com/AppImage/appimagetool/releases/download/continuous/$asset
          # The checksum comes from the release metadata, not from the download itself. The job
          # fails if GitHub doesn't publish one, rather than running an unchecked tool. The token
          # only raises the API rate limit.
          curl --proto '=https' --tlsv1.2 -sSfL -H "Authorization: Bearer $GH_TOKEN" \
            -o "$RUNNER_TEMP/release.json" "$release"
          digest=$(python3 -c '
          import json, sys
          asset = sys.argv[2]
          release = json.load(open(sys.argv[1]))
          match = [a.get("digest", "") for a in release.get("assets", []) if a.get("name") == asset]
          if not match or not match[0].startswith("sha256:"):
              sys.exit("no sha256 digest published for " + asset)
          print(match[0][len("sha256:"):])
          ' "$RUNNER_TEMP/release.json" "$asset")
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/appimagetool" "$url"
          echo "$digest  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Build the AppImage
        env:
          SKIP_BUILD: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x target/release/frog
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" sh packaging/appimage/build.sh

      - name: Upload the AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: target/FROG-x86_64.AppImage
          archive: false
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Built natively with the MSVC toolchain. build.rs embeds the icon with the Windows SDK's
      # resource compiler.
      - name: Release build
        run: cargo build --release --locked

      - name: Upload the Windows binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: target/release/frog.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS build (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # The tests run natively on Apple Silicon, to catch anything that only breaks on macOS.
      - name: Test
        run: cargo test --locked --all-targets

      - name: Build the app bundle
        run: sh packaging/macos/build.sh

      # A zip of FROG.app, made with ditto so the bundle's metadata survives. Uploaded as is,
      # so the download is the zip itself.
      - name: Upload the macOS app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: target/FROG-macos-universal.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
